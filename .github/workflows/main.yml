name: Build and release

on:
  push:
    branches:
      - develop
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag for the release, leave empty to build without one'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      TARGET: sg2002_recamera_emmc

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          # ninja-build and parallel live in universe.
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bc bison build-essential cmake cpio \
            device-tree-compiler dosfstools e2fsprogs fakeroot flex gawk gcc \
            g++ git jq libssl-dev libtool mtools ninja-build parallel \
            pkg-config python3 python3-dev rsync squashfs-tools sudo unzip \
            wget zip

          # The prebuilt make_ext4fs in build/tools/common/prebuild needs
          # libpcre.so.3, that is PCRE1. Ubuntu has only PCRE2 and dropped
          # PCRE1 from the archive, so the library comes from the package
          # pool. The package is the same on every Ubuntu release and only
          # needs libc, so it works on noble and on resolute alike.
          if ! [ -e /usr/lib/x86_64-linux-gnu/libpcre.so.3 ]; then
            curl -fsSL -o /tmp/libpcre3.deb \
              "http://archive.ubuntu.com/ubuntu/pool/main/p/pcre3/libpcre3_8.39-13build5_amd64.deb"
            sudo dpkg -i /tmp/libpcre3.deb
            rm -f /tmp/libpcre3.deb
          fi

      - name: Compute the cache key
        id: cache-key
        run: |
          # The compiler cache holds the object files of the whole tree.
          # The key covers the submodule pointers and the patches and
          # overlays that change what gets compiled.
          {
            git submodule status
            find external/build external/buildroot -type f \
              \( -name '*.mk' -o -name '*.patch' -o -name '*_defconfig' \
                 -o -name 'Config.in' -o -name '*.hash' \) -exec md5sum {} +
          } | md5sum | cut -d' ' -f1 > "$GITHUB_OUTPUT"
          echo "key=$(cat "$GITHUB_OUTPUT")" >> "$GITHUB_OUTPUT"

      - name: Restore the Buildroot download cache
        uses: actions/cache@v6
        with:
          path: output/${{ env.TARGET }}/buildroot-2021.05/dl
          key: buildroot-dl-v1

      - name: Restore the compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.buildroot-ccache
          key: buildroot-ccache-${{ steps.cache-key.outputs.key }}
          restore-keys: |
            buildroot-ccache-

      - name: Build
        run: |
          set -o pipefail
          # The build writes a lot to stdout and the log pipe of the runner
          # fills up, which kills it. It goes to a file instead, and a
          # heartbeat echoes the last line so a long build shows progress.
          ( while sleep 300; do
              echo "[heartbeat] $(tail -c 400 build.log 2>/dev/null | tr '\n' ' ' | tail -c 250)"
            done ) & MONPID=$!
          make ${{ env.TARGET }} > build.log 2>&1 || RC=$?
          RC=${RC:-0}
          kill $MONPID 2>/dev/null || true
          tail -60 build.log
          if [ "$RC" != "0" ]; then
            grep -nE "FAILED:|Error [0-9]+|error:|\*\*\*" build.log \
              | grep -vE "Entering|Leaving|ignored" | tail -20 || true
            exit $RC
          fi

      - name: Save the compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.buildroot-ccache
          key: buildroot-ccache-${{ steps.cache-key.outputs.key }}

      - name: Collect the artefacts
        id: artefacts
        run: |
          DIR=output/${{ env.TARGET }}/install/soc_${{ env.TARGET }}
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -la "$DIR"

          # The build names the files after the version in CHANGELOG.md,
          # so they are looked up by their suffix.
          shopt -s nullglob
          for suffix in emmc.zip emmc_ota.zip emmc_recovery.zip \
                        emmc_sd_compat.zip emmc_swu.zip emmc_sdk.tar.gz \
                        md5sum.txt; do
              files=( "$DIR"/*_"${suffix}" )
              if [ ${#files[@]} -ne 1 ]; then
                  echo "Error: expected one *_${suffix} in $DIR, found ${#files[@]}"
                  exit 1
              fi
              echo "asset_${suffix}=${files[0]}" >> "$GITHUB_OUTPUT"
          done

      - name: Upload the artefacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TARGET }}
          path: |
            output/${{ env.TARGET }}/install/soc_${{ env.TARGET }}/*.zip
            output/${{ env.TARGET }}/install/soc_${{ env.TARGET }}/*.tar.gz
            output/${{ env.TARGET }}/install/soc_${{ env.TARGET }}/*_md5sum.txt
          if-no-files-found: error

      - name: Read the changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # A dispatch carries the tag in the input, a tag push in the ref.
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          TITLE=$(grep -m1 "^## ${TAG}" CHANGELOG.md | sed 's/^## //')
          if [ -z "$TITLE" ]; then
              echo "Error: CHANGELOG.md has no entry for ${TAG}"
              exit 1
          fi
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

          # The entry runs from its own heading to the next one.
          sed -n "/^## ${TAG}[ (]/,/^## /p" CHANGELOG.md \
            | sed '1d;$d' | grep -v '^[[:space:]]*$' > body.md
          if [ ! -s body.md ]; then
              echo "Error: the entry for ${TAG} is empty"
              exit 1
          fi
          {
            echo "body<<EOF"
            cat body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.changelog.outputs.tag }}
          TITLE: ${{ steps.changelog.outputs.title }}
        run: |
          # The repository only allows actions from GitHub itself, so the
          # release is made with the gh CLI, which is on the runner image.
          DIR=output/${{ env.TARGET }}/install/soc_${{ env.TARGET }}
          shopt -s nullglob
          files=( "$DIR"/*.zip "$DIR"/*.tar.gz "$DIR"/*_md5sum.txt )
          if [ ${#files[@]} -eq 0 ]; then
              echo "Error: no release files in $DIR"
              exit 1
          fi

          gh release create "$TAG" "${files[@]}" \
            --title "$TITLE" \
            --notes-file body.md \
            --prerelease \
            --repo "$GITHUB_REPOSITORY"
